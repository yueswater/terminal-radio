# Station catalog. Every stream URL lives here, never in the code.
# band must be FM or AM. It drives the tabs of the terminal UI.
#
# The rest describes the station rather than the signal, and drives the filters
# of the search bar, of `radio stations` and of the HTTP API:
#
#   network    the family a station belongs to, which groups its frequencies
#   regions    where it is mainly heard, not where its company is registered
#   genres     what it mostly broadcasts, as many as apply
#   languages  BCP 47 tags: zh-Hant Mandarin, nan Taiwanese, hak Hakka, en
#
# regions and genres are closed sets. Their values are the ones listed in
# terminal_radio/enums/station.py, and a value outside them is a load error
# rather than a station nobody can find.
#
# fallback_urls is optional. url is always the address tried first; the backups
# are tried in turn as the reconnect delays elapse, and whichever one works is
# kept until the station is asked for again:
#
#   url = "https://primary.example/live"
#   fallback_urls = ["https://backup.example/live"]


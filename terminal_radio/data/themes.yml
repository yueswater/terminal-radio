# Color themes of the terminal UI. Cycle them at runtime with the t key.
# Every key below maps onto a Textual theme field.

default: sonic

themes:
  - name: sonic
    dark: true
    primary: "#3fb950"
    secondary: "#2f81f7"
    accent: "#d29922"
    foreground: "#e6edf3"
    background: "#0d1117"
    surface: "#161b22"
    panel: "#21262d"
    success: "#3fb950"
    warning: "#d29922"
    error: "#f85149"

  - name: midnight
    dark: true
    primary: "#7aa2f7"
    secondary: "#bb9af7"
    accent: "#7dcfff"

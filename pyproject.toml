[project]
name = "radio"
version = "0.1.0"
description = "Terminal radio player with a Textual UI and a FastAPI control API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
radio = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

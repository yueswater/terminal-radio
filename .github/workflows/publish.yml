name: Publish

# A tag publishes to PyPI, so what is released always has a name in the history
# pointing at it. TestPyPI is reachable by hand, for rehearsing a release
# without spending a version number on the real index.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install mpv
        run: sudo apt-get update && sudo apt-get install -y mpv

      - name: Run the test suite
        run: uv run --frozen python -m pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Only a tagged run claims a version number, so only it has to agree.
      - name: Check that the tag matches the project version
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $tag does not match version $version in pyproject.toml" >&2
            exit 1
          fi

      - name: Build the wheel and the source distribution
        run: uv build

      - name: Check the metadata renders on the index
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name has to match the one registered with the trusted
    # publisher on the index being published to.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    # Trusted publishing exchanges this token with the index, so no API token is
    # stored in the repository.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal repeats version numbers, and that is not a failure.
          skip-existing: true

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

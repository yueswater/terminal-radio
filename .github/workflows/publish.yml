name: Publish

# Publishing by hand: a rehearsal against TestPyPI, or a release the automated
# path could not finish. That path lives in release.yml, which carries its own
# copy of these steps because PyPI's trusted publishing refuses a reusable
# workflow.
#
# Deliberately started by hand only. A tag trigger here would be a second
# automatic route to the index alongside release.yml, and the two would race on
# a version that can only be uploaded once. It would also be a route that
# rarely fires: a tag pushed by release-please carries GITHUB_TOKEN, and GitHub
# does not start workflows from those, so it would only ever catch a tag pushed
# from somebody's terminal.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install mpv
        run: sudo apt-get update && sudo apt-get install -y mpv

      - name: Run the test suite
        run: uv run --frozen python -m pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Nothing here names a version but pyproject.toml, so there is nothing to
      # disagree with. It is still worth saying out loud which one is going up,
      # because this workflow is started by hand and can be aimed at any ref.
      - name: Say which version is being published
        run: echo "Publishing $(uv version --short) from ${GITHUB_REF_NAME}"

      - name: Build the wheel and the source distribution
        run: uv build

      - name: Check the metadata renders on the index
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name has to match the one registered with the trusted
    # publisher on the index being published to.
    environment: ${{ inputs.target || 'pypi' }}
    # Trusted publishing exchanges this token with the index, so no API token is
    # stored in the repository.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal repeats version numbers, and that is not a failure.
          skip-existing: true

      - name: Publish to PyPI
        if: inputs.target != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1

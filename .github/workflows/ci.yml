name: CI

# Every push and every pull request, so a break is found where it was made
# rather than at release time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install mpv
        run: sudo apt-get update && sudo apt-get install -y mpv

      - name: Run the test suite
        run: uv run --python ${{ matrix.python }} python -m pytest tests -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel and the source distribution
        run: uv build

      - name: Check the metadata renders on the index
        run: uvx twine check dist/*

      # A release is worthless if the thing it ships cannot start, so the
      # built wheel is installed and run rather than only inspected.
      - name: Install the wheel and run the command
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/radio --version
          /tmp/check/bin/radio stations --band AM | head -3

name: CI

# Every push and every pull request, so a break is found where it was made
# rather than at release time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install mpv
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y mpv ;;
            macOS)   brew install mpv ;;
            Windows) choco install mpv --no-progress -y ;;
          esac

      # Naming the folder chocolatey chose has failed twice, and a Windows
      # path added to PATH is not what the bash the tests run under expects.
      # The player already takes its command from the environment, so it is
      # pointed straight at the executable. Forward slashes survive shlex.
      - name: Point the player at mpv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem C:\ProgramData\chocolatey -Recurse -Filter mpv.exe `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "mpv.exe was not found under chocolatey" }
          $path = $exe.FullName -replace '\\', '/'
          Write-Host "found $path"
          Add-Content $env:GITHUB_ENV "RADIO_PLAYER_COMMAND=$path --no-video --no-terminal"

      - name: Run the test suite
        shell: bash
        run: uv run --python ${{ matrix.python }} python -m pytest tests -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel and the source distribution
        run: uv build

      - name: Check the metadata renders on the index
        run: uvx twine check dist/*

      # A release is worthless if the thing it ships cannot start, so the
      # built wheel is installed and run rather than only inspected.
      - name: Install the wheel and run the command
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/radio --version
          /tmp/check/bin/radio stations --band AM | head -3

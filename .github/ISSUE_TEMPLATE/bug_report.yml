name: Bug report
description: Report a reproducible problem in Radio
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include the Radio version, OS, terminal, Python version and mpv version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Remove private information before posting.

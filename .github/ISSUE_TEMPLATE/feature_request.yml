name: Feature request
description: Suggest a focused improvement to Radio
title: "[Feature] "
labels: []
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for a similar request.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed change
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: What else did you consider?
